<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agatha Accesorios · Pequeños detalles, grandes historias</title>
<meta name="description" content="Joyería y accesorios femeninos desde Concepción, Chile. Envíos a todo Chile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero.jpg" fetchpriority="high">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/product.css">

<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<div class="announce" id="announce">
  <span>Envíos a todo Chile</span><span class="dot">·</span><span>Paga en cuotas</span><span class="dot">·</span><span>Cambios sin costo</span>
  <button class="announce-x" data-act="hide-announce" aria-label="Cerrar aviso"><svg class="ic sm" viewBox="0 0 24 24" id="x-ic"></svg></button>
</div>

<header class="site-header" id="header">
  <div class="header-in">
    <button class="logo" data-go="inicio" aria-label="Agatha Accesorios, ir al inicio"><b>AGATHA</b><small>ACCESORIOS</small></button>
    <nav class="nav" id="nav" aria-label="Principal"></nav>
    <div class="tools" id="tools"></div>
  </div>
  <!-- La búsqueda vive dentro de la cabecera para que se quede pegada con ella -->
  <div class="searchbar" id="searchbar" hidden>
    <form id="search-form"><input id="search-input" type="search" placeholder="Buscar joyas… (ej: perla, aros, collar)" aria-label="Buscar productos"><button class="btn btn-primary btn-sm" type="submit">Buscar</button></form>
  </div>
</header>

<main id="app"></main>

<section class="news">
  <div class="news-in">
    <div><div class="eyebrow">Club Agatha</div><h2>Recibe novedades y un 10% en tu primera compra</h2></div>
    <form id="news-form"><input type="email" required placeholder="Tu correo electrónico" aria-label="Correo electrónico"><button type="submit" id="news-btn">Suscribirme</button></form>
  </div>
</section>

<footer class="site-footer" id="footer"></footer>

<a class="wa-float" href="https://wa.me/56912345678" target="_blank" rel="noopener" aria-label="WhatsApp" id="wa-float"></a>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="drawer-ov" id="drawer-ov" data-act="drawer-close" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Carrito de compras" hidden></aside>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/product.js"></script>
<script src="js/motion.js"></script>
<script src="js/app.js"></script>
